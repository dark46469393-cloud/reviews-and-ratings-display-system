<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casa Verde Heritage Homestay — Guest Reviews</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="listing-banner">
      <span class="badge-location">Fontainhas, Panjim</span>
      <h1>Casa Verde Heritage Homestay</h1>
      <p class="subtitle">Restored 19th-century Portuguese villa with courtyard garden</p>
    </header>

    <!-- Ratings Summary Section -->
    <section class="reviews-section" aria-labelledby="reviews-heading">
      <div class="section-top">
        <h2 id="reviews-heading">Guest Reviews &amp; Ratings</h2>
        <button type="button" id="toggle-form-btn" class="btn btn-primary">
          Write a Review
        </button>
      </div>

      <div class="summary-grid">
        <!-- Left: Big Average Score -->
        <div class="score-overview">
          <div class="big-score" id="avg-score">0.0</div>
          <div class="stars-display" id="avg-stars" aria-label="Average rating"></div>
          <p class="total-count" id="total-reviews">Based on 0 reviews</p>
        </div>

        <!-- Right: 5-to-1 Star Distribution Bars -->
        <div class="distribution-bars" id="distribution-container" aria-label="Rating breakdown">
          <!-- Populated dynamically by app.js -->
        </div>
      </div>

      <!-- Write a Review Form (Collapsible) -->
      <form id="review-form" class="review-form hidden" novalidate>
        <h3>Share Your Stay Experience</h3>

        <div class="form-row">
          <div class="form-group">
            <label for="reviewer-name">Your Name *</label>
            <input type="text" id="reviewer-name" placeholder="e.g. Rohan Desai" required />
          </div>

          <div class="form-group">
            <label for="trip-type">Trip Type *</label>
            <select id="trip-type" required>
              <option value="Couple">Couple</option>
              <option value="Family">Family</option>
              <option value="Solo">Solo</option>
              <option value="Friends">Friends</option>
              <option value="Workation">Workation</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <span id="star-picker-label" class="field-label">Overall Rating *</span>
          <div
            class="star-picker"
            id="star-picker"
            role="radiogroup"
            aria-labelledby="star-picker-label"
          >
            <button type="button" class="star-btn" role="radio" aria-checked="false" aria-label="1 star" data-value="1">★</button>
            <button type="button" class="star-btn" role="radio" aria-checked="false" aria-label="2 stars" data-value="2">★</button>
            <button type="button" class="star-btn" role="radio" aria-checked="false" aria-label="3 stars" data-value="3">★</button>
            <button type="button" class="star-btn" role="radio" aria-checked="false" aria-label="4 stars" data-value="4">★</button>
            <button type="button" class="star-btn" role="radio" aria-checked="false" aria-label="5 stars" data-value="5">★</button>
          </div>
          <span class="rating-hint" id="rating-hint">Select a rating (1 to 5 stars)</span>
        </div>

        <div class="form-group">
          <label for="review-title">Review Headline *</label>
          <input type="text" id="review-title" placeholder="Summarize your stay in a few words" required />
        </div>

        <div class="form-group">
          <label for="review-comment">Your Review *</label>
          <textarea id="review-comment" rows="4" placeholder="What did you love about the rooms, host, or neighborhood?" required></textarea>
        </div>

        <p class="form-error" id="form-error" role="alert"></p>

        <div class="form-actions">
          <button type="button" id="cancel-form-btn" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Review</button>
        </div>
      </form>

      <!-- Controls Bar: Filter & Sort -->
      <div class="controls-bar">
        <div class="active-filter" id="active-filter-bar">
          <span id="filter-status">Showing all reviews</span>
          <button type="button" id="clear-filter-btn" class="link-btn hidden">Clear filter</button>
        </div>

        <div class="sort-control">
          <label for="sort-select">Sort by:</label>
          <select id="sort-select">
            <option value="recent">Most Recent</option>
            <option value="helpful">Most Helpful</option>
          </select>
        </div>
      </div>

      <!-- Review Cards List -->
      <div class="reviews-list" id="reviews-list">
        <!-- Populated dynamically by app.js -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
